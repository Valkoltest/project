services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on: [app]
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/usr/share/nginx/images:ro
  app:
    build: ./
    container_name: app

    restart: unless-stopped
    
    environment:
      - LOG_DIR=/logs
    volumes:
      - ./images:/app/images
      - ./logs:/logs
  db:
    image: postgres:18-alpine
    shm_size: '128mb'
    restart: unless-stopped
    container_name: db
    environment:
      POSTGRES_USER: images_backend
      POSTGRES_PASSWORD: 1048575
      POSTGRES_DB: images_hosting
    
    # volumes:
    #   - ./db_data:/var/lib/postgresql/data
  
  
