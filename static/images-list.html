<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Images</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <div class="files-container">
        <h1>Images</h1>
            <table class="file-list">
                <thead>
                    <tr>
                        <th>Назва файлу</th>
                        <th>Оригінальна назва</th>
                        <th>Розмір (КБ)</th>
                        <th>Дата завантаження</th>
                        <th>Тип файлу</th>
                        <th>Відкрити файл</th>
                        <th>Видалити файл</th>
                    </tr>
                </thead>
                <tbody>
                    {items}     
                </tbody>
            </table>
            <div class="pagination">
                {pagination} 
            </div>                               
            <a class="back-link" href="http://localhost:8080/">Back to upload</a>   
        </div>
    </body>
    </html>
